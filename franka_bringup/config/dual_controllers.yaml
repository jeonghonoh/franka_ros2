      trajectory_file: "/home/rpm-dualarm/franka_ros2_ws/src/franka_bringup/config/cartesian_trajectory_02.yaml"
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
