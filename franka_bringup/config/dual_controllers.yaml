        - 30.0
        - 10.0
        - 10.0
        - 5.
  
  joint_trajectory_tracking_controller:
    ros__parameters:
      arm_id: "fr3"
      trajectory_file: "/home/rpm-dualarm/franka_ros2_ws/src/franka_bringup/config/joint_trajectory_02.yaml"
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
        - 10.0
        - 10.0
        - 5.
  
