      arm_id: "fr3"
      waypoint_file: "/home/rpm-dualarm/franka_ros2_ws/src/franka_bringup/config/joint_states.yaml"
      k_gains:
        - 600.0
        - 600.0
        - 600.0
        - 600.0
        - 250.0
        - 150.0
        - 50.0
      d_gains:
        - 30.0
        - 30.0
        - 30.0
        - 30.0
